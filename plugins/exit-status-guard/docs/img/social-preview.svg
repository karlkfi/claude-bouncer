<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldMark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7e57c2"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <ellipse cx="640" cy="380" rx="520" ry="300" fill="url(#glow)" opacity="0.25"/>

  <!-- ===== header ===== -->
  <!-- shield + broken chain link mark -->
  <g transform="translate(64,58)">
    <path d="M36 2 L70 14 V44 C70 66 54 80 36 88 C18 80 2 66 2 44 V14 Z"
          fill="url(#shieldMark)" stroke="#c4b5fd" stroke-width="1.6"/>
    <g transform="translate(38,43) rotate(-45)" fill="none" stroke="#f1ecff" stroke-width="5">
      <rect x="4" y="-7" width="24" height="14" rx="7"/>
      <rect x="-28" y="-7" width="24" height="14" rx="7"/>
    </g>
  </g>

  <text x="156" y="98" font-size="58" font-weight="800" letter-spacing="-1">
    <tspan fill="#e6edf3">exit-status</tspan><tspan fill="#a78bfa">-guard</tspan>
  </text>
  <text x="158" y="138" font-size="24" font-weight="500" fill="#c9d1d9" letter-spacing="0.2">
    Shell commands whose exit status is the answer
  </text>
  <text x="1216" y="138" text-anchor="end" font-size="18" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#a2aab4">github.com/karlkfi/claude-bouncer</text>

  <!-- ===== terminal panel ===== -->
  <g>
    <rect x="64" y="196" width="1152" height="380" rx="18" fill="#0b0f16" stroke="#222b38" stroke-width="1.5"/>
    <path d="M64 214 a18 18 0 0 1 18 -18 H1198 a18 18 0 0 1 18 18 V240 H64 Z" fill="#11161f"/>
    <circle cx="92" cy="218" r="6" fill="#ff5f56"/>
    <circle cx="114" cy="218" r="6" fill="#ffbd2e"/>
    <circle cx="136" cy="218" r="6" fill="#27c93f"/>
    <text x="640" y="223" text-anchor="middle" font-size="16" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#a2aab4">PreToolUse · bash</text>
  </g>

  <!-- The gate fails in all three. Only the rewrite lets $? say so, which is
       why each row carries the status it reports before and after. -->
  <text x="100" y="272" font-size="15" font-weight="700" fill="#c9d1d9" letter-spacing="1.5">THE GATE FAILED IN ALL THREE. ONLY THE REWRITES SAY SO.</text>

  <!-- Row i sits at y = 286 + i*91: the command as written, its reported exit
       status and the deny chip, then the rewrite and the status it recovers. -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
    <!-- the pipeline reports tail's status -->
    <text x="100" y="312" font-size="22" fill="#adbac7"><tspan fill="#7e57c2">$ </tspan>make check 2&gt;&amp;1 | tail -30; echo "EXIT=$?"</text>
    <g transform="translate(944,305)" stroke="#ff7b72" stroke-width="2.6" stroke-linecap="round">
      <path d="M-5 -5 L5 5"/><path d="M5 -5 L-5 5"/>
    </g>
    <text x="966" y="312" font-size="20" font-weight="700" fill="#ff7b72">EXIT=0</text>
    <g transform="translate(1088,292)">
      <rect x="0" y="0" width="92" height="32" rx="16" fill="#2d1418" stroke="#a63a3a" stroke-width="1.5"/>
      <circle cx="18" cy="16" r="7.5" fill="none" stroke="#ff7b72" stroke-width="2.2"/>
      <line x1="13" y1="21" x2="23" y2="11" stroke="#ff7b72" stroke-width="2.2" stroke-linecap="round"/>
      <text x="36" y="21" font-size="16" font-weight="700" font-family="-apple-system, sans-serif" fill="#ff7b72">deny</text>
    </g>
    <text x="124" y="344" font-size="19" fill="#7ee787"><tspan fill="#56d364">↳ </tspan>make check &gt; check.log 2&gt;&amp;1; echo "EXIT=$?"</text>
    <g transform="translate(944,337)" fill="none" stroke="#56d364" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-6 0 l4 4 l8 -9"/>
    </g>
    <text x="966" y="344" font-size="20" font-weight="700" fill="#56d364">EXIT=2</text>
    <!-- $? is the background launch, not pytest -->
    <text x="100" y="403" font-size="22" fill="#adbac7"><tspan fill="#7e57c2">$ </tspan>pytest -q &amp; echo "EXIT=$?"</text>
    <g transform="translate(944,396)" stroke="#ff7b72" stroke-width="2.6" stroke-linecap="round">
      <path d="M-5 -5 L5 5"/><path d="M5 -5 L-5 5"/>
    </g>
    <text x="966" y="403" font-size="20" font-weight="700" fill="#ff7b72">EXIT=0</text>
    <g transform="translate(1088,383)">
      <rect x="0" y="0" width="92" height="32" rx="16" fill="#2d1418" stroke="#a63a3a" stroke-width="1.5"/>
      <circle cx="18" cy="16" r="7.5" fill="none" stroke="#ff7b72" stroke-width="2.2"/>
      <line x1="13" y1="21" x2="23" y2="11" stroke="#ff7b72" stroke-width="2.2" stroke-linecap="round"/>
      <text x="36" y="21" font-size="16" font-weight="700" font-family="-apple-system, sans-serif" fill="#ff7b72">deny</text>
    </g>
    <text x="124" y="435" font-size="19" fill="#7ee787"><tspan fill="#56d364">↳ </tspan>pytest -q; echo "EXIT=$?"</text>
    <g transform="translate(944,428)" fill="none" stroke="#56d364" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-6 0 l4 4 l8 -9"/>
    </g>
    <text x="966" y="435" font-size="20" font-weight="700" fill="#56d364">EXIT=1</text>
    <!-- the push runs whether or not lint passed -->
    <text x="100" y="494" font-size="22" fill="#adbac7"><tspan fill="#7e57c2">$ </tspan>make lint; git push; echo "EXIT=$?"</text>
    <g transform="translate(944,487)" stroke="#ff7b72" stroke-width="2.6" stroke-linecap="round">
      <path d="M-5 -5 L5 5"/><path d="M5 -5 L-5 5"/>
    </g>
    <text x="966" y="494" font-size="20" font-weight="700" fill="#ff7b72">EXIT=0</text>
    <g transform="translate(1088,474)">
      <rect x="0" y="0" width="92" height="32" rx="16" fill="#2d1418" stroke="#a63a3a" stroke-width="1.5"/>
      <circle cx="18" cy="16" r="7.5" fill="none" stroke="#ff7b72" stroke-width="2.2"/>
      <line x1="13" y1="21" x2="23" y2="11" stroke="#ff7b72" stroke-width="2.2" stroke-linecap="round"/>
      <text x="36" y="21" font-size="16" font-weight="700" font-family="-apple-system, sans-serif" fill="#ff7b72">deny</text>
    </g>
    <text x="124" y="526" font-size="19" fill="#7ee787"><tspan fill="#56d364">↳ </tspan>make lint &amp;&amp; git push; echo "EXIT=$?"</text>
    <g transform="translate(944,519)" fill="none" stroke="#56d364" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-6 0 l4 4 l8 -9"/>
    </g>
    <text x="966" y="526" font-size="20" font-weight="700" fill="#56d364">EXIT=2</text>
  </g>
</svg>
