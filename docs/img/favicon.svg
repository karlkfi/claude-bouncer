<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7e57c2"/>
    </linearGradient>
  </defs>
  <!-- shield + git branch, centered: translate(76,31) scale(5) maps the 88-unit mark to a 512 canvas -->
  <g transform="translate(76,31) scale(5)">
    <path d="M36 2 L70 14 V44 C70 66 54 80 36 88 C18 80 2 66 2 44 V14 Z"
          fill="url(#shield)" stroke="#5b3da8" stroke-width="1.4"/>
    <!-- git branch: main line (two commits) + a feature branch diverging right -->
    <g fill="none" stroke="#f1ecff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M28 28 V60"/>
      <path d="M28 46 C40 46 44 41 44 32"/>
    </g>
    <g fill="#f1ecff">
      <circle cx="28" cy="28" r="6"/>
      <circle cx="28" cy="60" r="6"/>
      <circle cx="44" cy="30" r="6"/>
    </g>
  </g>
</svg>
