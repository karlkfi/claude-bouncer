<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldMark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7e57c2"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <ellipse cx="640" cy="380" rx="520" ry="300" fill="url(#glow)" opacity="0.25"/>

  <!-- ===== header ===== -->
  <!-- shield + velvet rope mark -->
  <g transform="translate(64,58)">
    <path d="M36 2 L70 14 V44 C70 66 54 80 36 88 C18 80 2 66 2 44 V14 Z"
          fill="url(#shieldMark)" stroke="#c4b5fd" stroke-width="1.6"/>
    <g fill="#f1ecff">
      <rect x="19.5" y="34" width="5" height="31" rx="2.5"/>
      <rect x="47.5" y="34" width="5" height="31" rx="2.5"/>
      <circle cx="22" cy="31" r="5"/>
      <circle cx="50" cy="31" r="5"/>
      <rect x="14" y="63" width="16" height="5" rx="2.5"/>
      <rect x="42" y="63" width="16" height="5" rx="2.5"/>
    </g>
    <path d="M22 34 C28 51 44 51 50 34" fill="none" stroke="#f1ecff" stroke-width="5" stroke-linecap="round"/>
  </g>

  <text x="156" y="98" font-size="58" font-weight="800" letter-spacing="-1">
    <tspan fill="#e6edf3">claude</tspan><tspan fill="#a78bfa">-bouncer</tspan>
  </text>
  <text x="158" y="138" font-size="24" font-weight="500" fill="#c9d1d9" letter-spacing="0.2">
    Five PreToolUse guards for Claude Code, one marketplace
  </text>
  <text x="1216" y="138" text-anchor="end" font-size="18" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#a2aab4">github.com/karlkfi/claude-bouncer</text>

  <!-- ===== the five guards ===== -->
  <!-- The cards are the only containers: the sibling previews frame their
       content in a terminal window because they show shell commands, and
       this one shows a catalogue. Card i sits at x = 76 + i*230, width 208;
       each glyph group is that plugin's own mark at scale 0.72. -->
  <g>
    <!-- workspace-guard -->
    <rect x="76" y="240" width="208" height="200" rx="14" fill="#11161f" stroke="#222b38" stroke-width="1.5"/>
    <g transform="translate(154.08,264) scale(0.72)">
      <path d="M36 2 L70 14 V44 C70 66 54 80 36 88 C18 80 2 66 2 44 V14 Z" fill="url(#shieldMark)" stroke="#c4b5fd" stroke-width="1.6"/>
      <g transform="translate(15,24)">
        <path d="M2 6 H14 L18 11 H40 V34 H2 Z" fill="#f1ecff" stroke="#f1ecff" stroke-width="1.6" stroke-linejoin="round"/>
      </g>
    </g>
    <text x="180" y="358" text-anchor="middle" font-size="19" font-weight="700" fill="#e6edf3">workspace-guard</text>
    <text x="180" y="384" text-anchor="middle" font-size="15" fill="#c9d1d9">Reads and writes outside</text>
    <text x="180" y="406" text-anchor="middle" font-size="15" fill="#c9d1d9">the project root</text>

    <!-- branch-guard -->
    <rect x="306" y="240" width="208" height="200" rx="14" fill="#11161f" stroke="#222b38" stroke-width="1.5"/>
    <g transform="translate(384.08,264) scale(0.72)">
      <path d="M36 2 L70 14 V44 C70 66 54 80 36 88 C18 80 2 66 2 44 V14 Z" fill="url(#shieldMark)" stroke="#c4b5fd" stroke-width="1.6"/>
      <g fill="none" stroke="#f1ecff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M28 28 V60"/>
        <path d="M28 46 C40 46 44 41 44 32"/>
      </g>
      <g fill="#f1ecff">
        <circle cx="28" cy="28" r="6"/>
        <circle cx="28" cy="60" r="6"/>
        <circle cx="44" cy="30" r="6"/>
      </g>
    </g>
    <text x="410" y="358" text-anchor="middle" font-size="19" font-weight="700" fill="#e6edf3">branch-guard</text>
    <text x="410" y="384" text-anchor="middle" font-size="15" fill="#c9d1d9">Commits and pushes to</text>
    <text x="410" y="406" text-anchor="middle" font-size="15" fill="#c9d1d9">a protected branch</text>

    <!-- prod-guard -->
    <rect x="536" y="240" width="208" height="200" rx="14" fill="#11161f" stroke="#222b38" stroke-width="1.5"/>
    <g transform="translate(614.08,264) scale(0.72)">
      <path d="M36 2 L70 14 V44 C70 66 54 80 36 88 C18 80 2 66 2 44 V14 Z" fill="url(#shieldMark)" stroke="#c4b5fd" stroke-width="1.6"/>
      <g fill="#f1ecff">
        <rect x="18" y="24" width="36" height="10" rx="3"/>
        <rect x="18" y="39" width="36" height="10" rx="3"/>
        <rect x="18" y="54" width="36" height="10" rx="3"/>
      </g>
      <g fill="#7e57c2">
        <circle cx="25" cy="29" r="2.4"/>
        <circle cx="25" cy="44" r="2.4"/>
        <circle cx="25" cy="59" r="2.4"/>
      </g>
    </g>
    <text x="640" y="358" text-anchor="middle" font-size="19" font-weight="700" fill="#e6edf3">prod-guard</text>
    <text x="640" y="384" text-anchor="middle" font-size="15" fill="#c9d1d9">Infra commands aimed</text>
    <text x="640" y="406" text-anchor="middle" font-size="15" fill="#c9d1d9">at production</text>

    <!-- exit-status-guard -->
    <rect x="766" y="240" width="208" height="200" rx="14" fill="#11161f" stroke="#222b38" stroke-width="1.5"/>
    <g transform="translate(844.08,264) scale(0.72)">
      <path d="M36 2 L70 14 V44 C70 66 54 80 36 88 C18 80 2 66 2 44 V14 Z" fill="url(#shieldMark)" stroke="#c4b5fd" stroke-width="1.6"/>
      <g transform="translate(38,43) rotate(-45)" fill="none" stroke="#f1ecff" stroke-width="5">
        <rect x="4" y="-7" width="24" height="14" rx="7"/>
        <rect x="-28" y="-7" width="24" height="14" rx="7"/>
      </g>
    </g>
    <text x="870" y="358" text-anchor="middle" font-size="19" font-weight="700" fill="#e6edf3">exit-status-guard</text>
    <text x="870" y="384" text-anchor="middle" font-size="15" fill="#c9d1d9">A failing gate that</text>
    <text x="870" y="406" text-anchor="middle" font-size="15" fill="#c9d1d9">reports success</text>

    <!-- foreground-guard -->
    <rect x="996" y="240" width="208" height="200" rx="14" fill="#11161f" stroke="#222b38" stroke-width="1.5"/>
    <g transform="translate(1074.08,264) scale(0.72)">
      <path d="M36 2 L70 14 V44 C70 66 54 80 36 88 C18 80 2 66 2 44 V14 Z" fill="url(#shieldMark)" stroke="#c4b5fd" stroke-width="1.6"/>
      <g fill="#f1ecff">
        <rect x="19" y="24" width="34" height="5" rx="2.5"/>
        <rect x="19" y="63" width="34" height="5" rx="2.5"/>
        <path d="M23 30 H49 L36 46 Z M36 46 L49 62 H23 Z"/>
      </g>
    </g>
    <text x="1100" y="358" text-anchor="middle" font-size="19" font-weight="700" fill="#e6edf3">foreground-guard</text>
    <text x="1100" y="384" text-anchor="middle" font-size="15" fill="#c9d1d9">Polls and waits on</text>
    <text x="1100" y="406" text-anchor="middle" font-size="15" fill="#c9d1d9">the main thread</text>
  </g>

  <!-- install line -->
  <g>
    <rect x="313" y="468" width="654" height="46" rx="23" fill="#1b1530" stroke="#7e57c2" stroke-width="1.5"/>
    <text x="640" y="498" text-anchor="middle" font-size="22" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#c4b5fd">/plugin marketplace add karlkfi/claude-bouncer</text>
  </g>
</svg>
