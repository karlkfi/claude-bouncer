name: release-note

# Repo-wide: one PR body convention for all five plugins.

# `edited` matters as much as `opened`: answering the block is a body edit,
# and without it a corrected pull request stays red until an unrelated push.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  # The job id is the name that shows up in the checks list and in branch
  # protection's required-checks picker, so it matches what the docs call it.
  release-note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Through the environment, never `${{ }}` inside `run:` -- a pull
      # request body is attacker-controlled text and would be interpolated
      # into the shell before it ever reached the script.
      - env:
          BODY: ${{ github.event.pull_request.body }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # Dependabot writes its own body and has no option to template one,
          # so it cannot answer the block. Exempt rather than skip: the job
          # still runs and reports, because a skipped check reads as a pass in
          # the checks list and this repo does not spend that distinction.
          # `pull_request.user.login`, not `github.actor` -- the actor on an
          # `edited` event is whoever edited the body, which may be a human.
          if [ "$AUTHOR" = 'dependabot[bot]' ]; then
            echo "Dependabot pull request: exempt from the release-note block."
            echo "The bump itself is the note; see .github/dependabot.yml."
            exit 0
          fi
          if ! printf '%s' "$BODY" | python3 scripts/release-note.py; then
            echo
            echo "The '## Release note' block is missing or unanswered."
            echo "Copy it from .github/pull_request_template.md and answer it:"
            echo "  * one line, in the voice of a release bullet, when a decision"
            echo "    moves or an operator-visible message changes; or"
            echo "  * None -- no bullet in the release notes, fold this pull"
            echo "    request into the changelog link."
            exit 1
          fi
