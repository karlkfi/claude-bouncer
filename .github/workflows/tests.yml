name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m unittest discover tests

  # An ordinary gate since Q39: the suite passes on Windows. A few tests skip
  # there -- they run everywhere else, and a plain run reports OK either way,
  # so the count is capped. Q43 made the home directory resolve without $HOME,
  # which took this from 50 to 3; the 3 left are real platform splits. Raise it
  # only with a reason.
  unittest-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/skip-ceiling.py --max-skips 3
