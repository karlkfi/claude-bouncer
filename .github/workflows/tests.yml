name: tests

on:
  push:
    branches: [main]
  pull_request:
  # On demand, for re-running the suite against an unchanged tree -- the case
  # that comes up when a flake is suspected and nothing needs pushing.
  workflow_dispatch:

# Each plugin keeps the jobs it had as its own repo, scoped with
# working-directory. They are deliberately not collapsed into one matrix: the
# per-plugin jobs differ in Python floor, in OS coverage, and in the
# mutation-control jobs that prove a suite can still go red, and a matrix that
# averaged those would weaken every one of them to the weakest.

jobs:
  # ---------------------------------------------------------------- path gate
  # Classify the diff once, then let each job below skip when nothing it covers
  # changed. Every guard is independent -- a workspace-guard fix cannot break
  # prod-guard unless it went through lib/ -- so a PR touching one plugin has no
  # reason to spend the other four.
  #
  # The workflow itself carries NO top-level `paths:`. A workflow skipped that
  # way reports no check at all, which leaves a required check Pending forever;
  # triggering on every PR and skipping inside means each job either runs or
  # reports as skipped, and a `<workflow>-gate` job can be required later
  # without revisiting any of this.
  #
  # A skipped job is a path-skip, NOT a pass. Nothing here says so in the checks
  # list, so read the filters below before reading a green run as coverage.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    # Fail OPEN. paths-filter resolves the changed-file list through one
    # un-retried API call, so a transient 5xx would otherwise skip every gated
    # job -- the most expensive kind of false negative, because `main` ends up
    # green on evidence it never gathered. An unclassifiable diff runs
    # everything instead.
    outputs:
      workspace_guard: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.workspace_guard || 'true' }}
      branch_guard: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.branch_guard || 'true' }}
      prod_guard: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.prod_guard || 'true' }}
      foreground_guard: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.foreground_guard || 'true' }}
      exit_status_guard: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.exit_status_guard || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        continue-on-error: true
        with:
          # A plugin's filter is its whole directory, deliberately. Suites read
          # tracked Markdown from under their own root -- exit-status-guard
          # globs commands/*.md, prod-guard reads commands/friction-report.md --
          # so a filter that let "docs" mean "no code" would go green by
          # skipping the suite covering the file being edited.
          #
          # Which docs are test inputs is a list that rots: workspace-guard was
          # a third example until its docs/STATUS.md moved to the root store,
          # and nothing would have told a narrower filter to stop naming it.
          # The directory is the one boundary that stays correct on its own.
          #
          # `shared` is the anchor every plugin pulls in. lib/ reaches all five
          # through the vendored copies, and an edit there that skipped
          # `make sync` would show no plugins/*/lib change at all.
          filters: |
            shared: &shared
              - 'lib/**'
              - 'scripts/sync-lib.py'
              - '.github/workflows/tests.yml'
            workspace_guard:
              - *shared
              - 'plugins/workspace-guard/**'
            branch_guard:
              - *shared
              - 'plugins/branch-guard/**'
            prod_guard:
              - *shared
              - 'plugins/prod-guard/**'
            foreground_guard:
              - *shared
              - 'plugins/foreground-guard/**'
            exit_status_guard:
              - *shared
              - 'plugins/exit-status-guard/**'

  # ------------------------------------------------- shared parser and backlog
  # Runs first and on the widest Python range: every guard imports the parser,
  # so its floor is the lowest floor any plugin supports (3.9,
  # exit-status-guard's). The root suite also carries the backlog gate --
  # test_backlog.py runs scripts/queue.py over docs/queue/ and over stores
  # carrying one introduced defect each, so the gate is shown able to fail.
  shared-parser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # Before the tests: a plugin suite passing against a stale vendored copy
      # is the exact failure this gate exists to catch.
      - run: python3 scripts/sync-lib.py --check
      # The marketplace entry is what `claude plugin update` compares, so a
      # bump that misses it ships nothing while the README announces it.
      - run: python3 scripts/version-check.py
      # The filters below decide which of this workflow's jobs run at all, so a
      # plugin missing from them skips its suite on every pull request.
      - run: python3 scripts/path-filter-check.py
      # A tag is a pointer its owner can move, so an unpinned action makes
      # every job here depend on a third party not rewriting one.
      - run: python3 scripts/action-pin-check.py
      - run: python3 -m unittest discover tests

  # --------------------------------------------------------- workspace-guard
  workspace-guard:
    needs: [changes]
    if: needs.changes.outputs.workspace_guard == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 scripts/run-tests.py
        working-directory: plugins/workspace-guard

  # Q70 sharded the matrix above, which runs each test in a worker holding only
  # a slice of the suite. That hides an order dependence between two tests as
  # surely as a serial run hides a race between them, so one job keeps running
  # the suite the plain way.
  workspace-guard-serial:
    needs: [changes]
    if: needs.changes.outputs.workspace_guard == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python3 -m unittest discover tests
        working-directory: plugins/workspace-guard

  # The default shell is pwsh, which is the right model for THIS job: Claude
  # Code launches the hook through run-python-hook.cmd, so the hook process
  # inherits a cmd.exe environment with no $HOME. A few tests skip on Windows
  # and a plain run reports OK either way, so the count is capped.
  workspace-guard-windows:
    needs: [changes]
    if: needs.changes.outputs.workspace_guard == 'true' || github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python scripts/run-tests.py --max-skips 5
        working-directory: plugins/workspace-guard

  # The same suite under Git Bash, what Claude Code's Bash tool runs on native
  # Windows. MSYS rewrites path-shaped variables on the way into a native
  # binary, so every environment-reading helper has two distinct Windows
  # environments to be correct in and pwsh only covers one.
  workspace-guard-windows-gitbash:
    needs: [changes]
    if: needs.changes.outputs.workspace_guard == 'true' || github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python scripts/run-tests.py --max-skips 3
        shell: bash
        working-directory: plugins/workspace-guard

  # ------------------------------------------------------------ branch-guard
  branch-guard:
    needs: [changes]
    if: needs.changes.outputs.branch_guard == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # git and jq are preinstalled on ubuntu-latest; the harness uses both.
      - run: bash test/run.sh
        working-directory: plugins/branch-guard

  # Windows resolves paths through ntpath, where a leading slash is
  # drive-relative -- so a POSIX-shaped path lands on the hook process's drive
  # and the repo lookup misses, silently downgrading a protected-branch `ask`
  # to no decision at all. Nothing in the Linux matrix can catch that.
  branch-guard-windows:
    needs: [changes]
    if: needs.changes.outputs.branch_guard == 'true' || github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: bash test/run.sh
        shell: bash
        working-directory: plugins/branch-guard

  # -------------------------------------------------------------- prod-guard
  prod-guard:
    needs: [changes]
    if: needs.changes.outputs.prod_guard == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m unittest discover tests
        working-directory: plugins/prod-guard

  # -------------------------------------------------------- foreground-guard
  foreground-guard:
    needs: [changes]
    if: needs.changes.outputs.foreground_guard == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m unittest discover tests
        working-directory: plugins/foreground-guard

  # ------------------------------------------------------- exit-status-guard
  # No macOS leg. Every platform fork in the guard is POSIX-vs-Windows and is
  # discriminated as such -- `scratch_root` keys on `hasattr(os, 'getuid')`, the
  # launcher on `os.name == 'nt'`, and test_packaging reads git's index modes
  # rather than the working tree -- so a macOS runner re-runs the ubuntu path
  # under a different kernel and nothing else. It was 20 of this workflow's 82
  # runner-minute equivalents (macOS bills at 10x) for no distinct code path.
  # The launcher job below keeps its macOS leg, which does have one.
  exit-status-guard:
    needs: [changes]
    if: needs.changes.outputs.exit_status_guard == 'true' || github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
        working-directory: plugins/exit-status-guard

  # The suite runs the guard with sys.executable, so the launcher hooks.json
  # actually invokes is never executed by it. A launcher that stops working
  # does not fail loudly -- Claude Code lets the tool call proceed -- so the
  # guard would just quietly stop enforcing.
  #
  # This one keeps macOS where the suite above drops it. launcher_check runs the
  # wired command line through `sh -c`, and `sh` is dash on ubuntu and bash 3.2
  # on macOS -- two dialects reading the same hand-written cmd.exe/POSIX
  # polyglot, and a dialect difference is the one thing a Linux runner
  # structurally cannot show.
  exit-status-guard-launcher:
    needs: [changes]
    if: needs.changes.outputs.exit_status_guard == 'true' || github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python tests/launcher_check.py
        working-directory: plugins/exit-status-guard

  # The suite asserts both directions, so a harness that silently stopped
  # loading the guard would still report OK. This breaks one rule and requires
  # the suite to go red -- if it stays green, the tests are not testing it.
  exit-status-guard-mutation-control:
    needs: [changes]
    if: needs.changes.outputs.exit_status_guard == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/exit-status-guard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Disable the pipe rule
        run: |
          python - <<'PY'
          import pathlib
          p = pathlib.Path('scripts/bash-exit-status-guard.py')
          s = p.read_text()
          old = "        if next_op(seg.post_ops) not in PIPE_OPS:\n            continue"
          new = "        if True:\n            continue"
          assert old in s, "mutation target not found -- update this job"
          p.write_text(s.replace(old, new, 1))
          PY
      - name: The suite must fail
        run: |
          python -m unittest discover -s tests > mutant.log 2>&1 && rc=0 || rc=$?
          echo "suite exit: $rc"
          tail -5 mutant.log
          if [ "$rc" -eq 0 ]; then
            echo "::error::the suite passed with the pipe rule disabled" >&2
            exit 1
          fi

  # A launcher that never runs the guard produces exactly the empty stdout a
  # clean command produces, so the launcher job is only worth anything if it
  # can go red.
  exit-status-guard-launcher-mutation-control:
    needs: [changes]
    if: needs.changes.outputs.exit_status_guard == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/exit-status-guard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Break the interpreter probe
        run: |
          python - <<'PY'
          import pathlib
          p = pathlib.Path('scripts/run-python-hook.cmd')
          s = p.read_text()
          old = 'for interp in python3 python; do'
          new = 'for interp in python-does-not-exist; do'
          assert old in s, "mutation target not found -- update this job"
          p.write_text(s.replace(old, new, 1))
          PY
      - name: The launcher check must fail
        run: |
          python tests/launcher_check.py > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          if [ "$rc" -eq 0 ]; then
            echo "::error::the launcher check passed with no working interpreter" >&2
            exit 1
          fi

  # The 1.0.0 bug: the launcher shipped mode 644, the shell refused it, and the
  # hook exited 126 with nothing on stdout -- which Claude Code reads as no
  # objection. Both checks that cover it have to go red when it comes back.
  exit-status-guard-packaging-mutation-control:
    needs: [changes]
    if: needs.changes.outputs.exit_status_guard == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/exit-status-guard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Ship the launcher non-executable
        run: |
          chmod -x scripts/run-python-hook.cmd
          git update-index --chmod=-x scripts/run-python-hook.cmd
      - name: The suite and the launcher check must fail
        run: |
          python -m unittest discover -s tests > suite.log 2>&1 && suite=0 || suite=$?
          python tests/launcher_check.py > launcher.log 2>&1 && launcher=0 || launcher=$?
          echo "suite exit: $suite, launcher exit: $launcher"
          tail -5 suite.log
          cat launcher.log
          if [ "$suite" -eq 0 ]; then
            echo "::error::the suite passed with the launcher shipped non-executable" >&2
            exit 1
          fi
          if [ "$launcher" -eq 0 ]; then
            echo "::error::the launcher check passed with the launcher non-executable" >&2
            exit 1
          fi
