name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python -m unittest discover -s tests -v

  # The suite runs bash-pipe-guard.py with sys.executable, so the launcher
  # hooks.json actually invokes is never executed by it. Its cmd.exe half and
  # its POSIX tail are separate code paths, so every OS runs this. A launcher
  # that stops working does not fail loudly -- Claude Code lets the tool call
  # proceed -- so the guard would just quietly stop enforcing.
  launcher:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Drive the hook through the launcher
        run: python tests/launcher_check.py

  # The suite asserts both directions, so a harness that silently stopped
  # loading the guard would still report OK. This job breaks one rule and
  # requires the suite to go red -- if it stays green, the tests are not
  # testing the thing.
  mutation-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Disable the pipe rule
        run: |
          python - <<'PY'
          import pathlib
          p = pathlib.Path('scripts/bash-pipe-guard.py')
          s = p.read_text()
          old = "        if next_op(seg.post_ops) not in PIPE_OPS:\n            continue"
          new = "        if True:\n            continue"
          assert old in s, "mutation target not found -- update this job"
          p.write_text(s.replace(old, new, 1))
          PY
      - name: The suite must fail
        run: |
          python -m unittest discover -s tests > mutant.log 2>&1 && rc=0 || rc=$?
          echo "suite exit: $rc"
          tail -5 mutant.log
          if [ "$rc" -eq 0 ]; then
            echo "::error::the suite passed with the pipe rule disabled" >&2
            exit 1
          fi

  # A launcher that never runs the guard produces exactly the empty stdout a
  # clean command produces, so the launcher job is only worth anything if it
  # can go red. This breaks the interpreter probe and requires it to.
  launcher-mutation-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Break the interpreter probe
        run: |
          python - <<'PY'
          import pathlib
          p = pathlib.Path('scripts/run-python-hook.cmd')
          s = p.read_text()
          old = 'for interp in python3 python; do'
          new = 'for interp in python-does-not-exist; do'
          assert old in s, "mutation target not found -- update this job"
          p.write_text(s.replace(old, new, 1))
          PY
      - name: The launcher check must fail
        run: |
          python tests/launcher_check.py > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          if [ "$rc" -eq 0 ]; then
            echo "::error::the launcher check passed with no working interpreter" >&2
            exit 1
          fi
